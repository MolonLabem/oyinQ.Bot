name: OyinQ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore oyinQ.Bot.slnx

      - name: Build
        run: dotnet build oyinQ.Bot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test oyinQ.Bot.slnx --configuration Release --no-build --no-restore

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, miniapp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file Dockerfile --tag oyinq-bot:ci .

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MiniApp/package-lock.json
      - name: Install Mini App dependencies
        working-directory: MiniApp
        run: npm ci
      - name: Typecheck Mini App
        working-directory: MiniApp
        run: npm run check
      - name: Test Mini App
        working-directory: MiniApp
        run: npm test
      - name: Build Mini App
        working-directory: MiniApp
        run: npm run build

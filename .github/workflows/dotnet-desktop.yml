name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore oyinQ.Bot.slnx

      - name: Build
        run: dotnet build oyinQ.Bot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test oyinQ.Bot.slnx --configuration Release --no-build --no-restore

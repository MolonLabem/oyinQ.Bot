name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore oyinQ.Bot.slnx

      - name: Build
        run: dotnet build oyinQ.Bot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test oyinQ.Bot.slnx --configuration Release --no-build --no-restore

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file Dockerfile --tag oyinq-bot:ci .

  tesera-reader-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public game page through Reader
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            'https://r.jina.ai/https://tesera.ru/game/carcassonne/' \
            | head -c 6000
      - name: Probe public user collection page through Reader
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            'https://r.jina.ai/https://tesera.ru/user/Karn/games/owns/' \
            | head -c 12000
      - name: Probe mobile public collection through Reader
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            'https://r.jina.ai/https://m.tesera.ru/collections/karn/own' \
            | head -c 12000

name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore oyinQ.Bot.slnx

      - name: Build
        run: dotnet build oyinQ.Bot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test oyinQ.Bot.slnx --configuration Release --no-build --no-restore

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --file Dockerfile --tag oyinq-bot:ci .

  tesera-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production Tesera health
        run: |
          set -euo pipefail
          response=$(mktemp)
          code=$(curl --silent --show-error --max-time 20 \
            --output "$response" --write-out '%{http_code}' \
            'https://p01--oyinqbot--668p7wnqfhrf.code.run/health/tesera')
          echo "HTTP $code"
          cat "$response"
          echo
          test "$code" = "503"
          grep -q '"dependency":"tesera"' "$response"
          grep -q '"status":"unavailable"' "$response"
          grep -q '"reason":"http_403"' "$response"
          if grep -q 'отклонила запрос' "$response"; then
            echo 'Raw provider error leaked' >&2
            exit 1
          fi

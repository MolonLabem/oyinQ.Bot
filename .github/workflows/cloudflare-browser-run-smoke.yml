name: Cloudflare Browser Run smoke

on:
  push:
    branches:
      - agent/tesera-browser-run-poc
  workflow_dispatch:

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: cloudflare/tesera-browser-run
        run: npm install --no-audit --no-fund

      - name: Deploy Browser Run Worker
        id: deploy
        working-directory: cloudflare/tesera-browser-run
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx wrangler deploy 2>&1)
          printf '%s\n' "$output"

          worker_url=$(printf '%s\n' "$output" \
            | grep -oE 'https://[^[:space:]]+\.workers\.dev' \
            | tail -1)

          if [ -z "$worker_url" ]; then
            echo "Could not find workers.dev URL in Wrangler output." >&2
            exit 1
          fi

          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "### Browser Run Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "$worker_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test Tesera through Browser Run
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          response=$(mktemp)
          code=$(curl --silent --show-error --max-time 45 \
            --output "$response" --write-out '%{http_code}' \
            "$WORKER_URL/games/carcassonne")

          echo "Browser Run probe: HTTP $code"
          cat "$response"
          echo

          if [ "$code" != "200" ]; then
            exit 1
          fi

          python3 - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              payload = json.load(f)
          if not isinstance(payload, dict):
              raise SystemExit("Tesera response is not a JSON object")
          print("Tesera JSON received through Browser Run.")
          PY

          blocked=$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            "$WORKER_URL/games/not-allowed")
          test "$blocked" = "404"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oyinq
      POSTGRES_USER: oyinq
      POSTGRES_PASSWORD: oyinq
    ports:
      - "5432:5432"
    volumes:
      - oyinq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oyinq -d oyinq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oyinq-postgres:
